server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 静态资源长缓存
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # SPA 路由回退
  location / {
    try_files $uri $uri/ /index.html;
  }
}
